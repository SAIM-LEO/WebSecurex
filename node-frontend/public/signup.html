<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | WebSecureX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hacker-mode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container fadeInUp">
        <div class="auth-card neon-border">
            <h1 class="glitch" data-text="WEBSECUREX">WEBSECUREX</h1>
            <p class="tagline">> CREATE YOUR ACCOUNT</p>
            
            <form id="signup-form">
                <div class="input-group">
                    <label>👤 USERNAME</label>
                    <input type="text" id="username" placeholder="choose a handle" required minlength="3">
                </div>
                <div class="input-group">
                    <label>📧 EMAIL ADDRESS</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="input-group">
                    <label>🔒 PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="min 6 chars" required minlength="6">
                    </div>
                </div>
                <div class="input-group">
                    <label>🔒 CONFIRM PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" placeholder="re-type password" required>
                    </div>
                </div>
                <div id="error-msg" class="error-text"></div>
                <div id="success-msg" class="success-text"></div>
                <button type="submit" class="btn btn-primary full-width">CREATE ACCOUNT ➔</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </div>

    <div class="watermark-shield"></div>

    <script src="js/app.js"></script>
</body>
</html>
